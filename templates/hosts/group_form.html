<div>
  <div class="modal-header">
    <h3 style="font-size: 1.25rem;">Add Host Group</h3>
    <button @click="modalOpen = false" class="modal-close">
      <svg viewBox="0 0 24 24" fill="currentColor">
        <path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/>
      </svg>
    </button>
  </div>

  <form 
    hx-post="/groups" 
    hx-target="#groups-list-container" 
    hx-swap="innerHTML" 
    @submit="modalOpen = false"
    style="display: flex; flex-direction: column; gap: 1rem;"
  >
    <div class="form-group">
      <label for="group_name" class="form-label">Group Name</label>
      <input type="text" id="group_name" name="name" class="form-control" placeholder="e.g. Production, Testing" required>
    </div>
    
    <div class="form-group">
      <label for="group_description" class="form-label">Description</label>
      <textarea id="group_description" name="description" class="form-control" placeholder="Optional notes about this group" rows="3"></textarea>
    </div>

    <div style="display: flex; justify-content: flex-end; gap: 0.75rem; margin-top: 1rem;">
      <button type="button" @click="modalOpen = false" class="btn btn-secondary">Cancel</button>
      <button type="submit" class="btn btn-primary">Save Group</button>
    </div>
  </form>
</div>
