<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | OpsPanel</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body style="background-image: radial-gradient(circle at center, hsla(262, 83%, 58%, 0.2) 0%, transparent 60%), radial-gradient(circle at 10% 20%, hsla(217, 91%, 60%, 0.15) 0%, transparent 40%); background-attachment: fixed;">
  
  <div class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-header">
        <div class="brand-logo" style="margin-bottom: 0.5rem; transform: scale(1.125);">
          <!-- Raw SVG Server Icon -->
          <svg viewBox="0 0 24 24" fill="currentColor" style="width: 1.5rem; height: 1.5rem;">
            <path d="M20 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 14H4V6h16v12zM8 15h8v2H8v-2zm0-4h8v2H8v-2z"/>
          </svg>
        </div>
        <h2 style="font-size: 1.5rem;" class="text-gradient">OpsPanel Jump Portal</h2>
        <p style="font-size: 0.875rem; color: var(--text-secondary);">Authenticate to access laboratory nodes</p>
      </div>

      {% if error %}
      <div class="auth-alert">
        <svg viewBox="0 0 24 24" fill="currentColor" style="width: 1.25rem; height: 1.25rem; flex-shrink: 0;">
          <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/>
        </svg>
        <span>{{ error }}</span>
      </div>
      {% endif %}

      <form action="/login" method="POST" style="display: flex; flex-direction: column; gap: 0.5rem;">
        <div class="form-group">
          <label for="username" class="form-label">Username</label>
          <input type="text" id="username" name="username" class="form-control" placeholder="Enter username" required autofocus autocomplete="username">
        </div>
        
        <div class="form-group" style="margin-bottom: 1.5rem;">
          <label for="password" class="form-label">Password</label>
          <input type="password" id="password" name="password" class="form-control" placeholder="Enter password" required autocomplete="current-password">
        </div>
        
        <button type="submit" class="btn btn-primary" style="width: 100%;">
          Sign In
        </button>
      </form>
    </div>
  </div>

</body>
</html>
