<div x-data="{ auth_type: '{{ credential.auth_type.value if credential else 'password' }}' }">
  <div class="modal-header">
    <h3 style="font-size: 1.25rem;">{{ "Edit Credential Profile" if credential else "Add Credential Profile" }}</h3>
    <button @click="modalOpen = false" class="modal-close">
      <svg viewBox="0 0 24 24" fill="currentColor">
        <path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/>
      </svg>
    </button>
  </div>

  <form 
    {% if credential %}
      hx-post="/credentials/{{ credential.id }}/edit"
    {% else %}
      hx-post="/credentials"
    {% endif %}
    hx-target="#credentials-table-container" 
    hx-swap="outerHTML" 
    @submit="modalOpen = false"
    style="display: flex; flex-direction: column; gap: 1rem;"
  >
    <div class="form-group">
      <label for="cred_name" class="form-label">Profile Name</label>
      <input type="text" id="cred_name" name="name" class="form-control" placeholder="e.g. root-pwd-prod, admin-ssh-key" value="{{ credential.name if credential else '' }}" required>
    </div>

    <div class="form-group">
      <label for="cred_username" class="form-label">Username</label>
      <input type="text" id="cred_username" name="username" class="form-control" placeholder="e.g. root, administrator" value="{{ credential.username if credential else '' }}" required>
    </div>

    <div class="form-group">
      <label for="auth_type" class="form-label">Auth Type</label>
      <select id="auth_type" name="auth_type" class="form-control" x-model="auth_type" required>
        <option value="password">Password</option>
        <option value="ssh_key">SSH Private Key</option>
      </select>
    </div>

    <!-- Password / Passphrase field -->
    <div class="form-group">
      <label for="secret" class="form-label" x-text="auth_type === 'password' ? 'Password' : 'Key Passphrase (optional)'">Password</label>
      <input type="password" id="secret" name="secret" class="form-control" 
             {% if credential %}
             placeholder="Leave blank to keep existing"
             {% else %}
             placeholder="Enter password/passphrase"
             :required="auth_type === 'password'"
             {% endif %}>
    </div>

    <!-- SSH Private Key field -->
    <div class="form-group" x-show="auth_type === 'ssh_key'">
      <label for="private_key" class="form-label">PEM Private Key</label>
      <textarea id="private_key" name="private_key" class="form-control" rows="5"
                {% if credential %}
                placeholder="Leave blank to keep existing private key"
                {% else %}
                placeholder="Paste RSA/ECDSA PEM private key here..."
                :required="auth_type === 'ssh_key'"
                {% endif %}></textarea>
    </div>

    <div style="display: flex; justify-content: flex-end; gap: 0.75rem; margin-top: 1rem;">
      <button type="button" @click="modalOpen = false" class="btn btn-secondary">Cancel</button>
      <button type="submit" class="btn btn-primary">Save Credential</button>
    </div>
  </form>
</div>
