{% if saved_commands %}
  {% for cmd in saved_commands %}
    <div class="saved-command-item card" id="saved-cmd-{{ cmd.id }}" style="padding: 0.75rem 1rem; display: flex; align-items: center; justify-content: space-between; border-radius: var(--radius-md); background: rgba(255, 255, 255, 0.03); margin-bottom: 0.5rem; border: 1px solid var(--border); transition: all 0.2s ease; transform: none; box-shadow: none;">
      <div class="cmd-info" style="cursor: pointer; flex-grow: 1; display: flex; flex-direction: column; gap: 0.25rem; overflow: hidden; padding-right: 0.5rem;" onclick="loadCommand({{ cmd.id }})">
        <script type="application/json" id="cmd-data-{{ cmd.id }}">
          {
            "name": {{ cmd.name | tojson }},
            "body": {{ cmd.body | tojson }}
          }
        </script>
        <span class="cmd-name" style="font-weight: 600; font-size: 0.875rem; color: var(--text-primary); text-overflow: ellipsis; overflow: hidden; white-space: nowrap;">{{ cmd.name }}</span>
        <span class="cmd-os" style="font-size: 0.6875rem; color: var(--primary); font-weight: 500; text-transform: uppercase;">{{ cmd.target_os.value }}</span>
      </div>
      <button class="btn btn-danger" 
              style="padding: 0.25rem 0.5rem; font-size: 0.75rem; line-height: 1; min-width: unset; flex-shrink: 0;"
              hx-delete="/commands/{{ cmd.id }}"
              hx-target="#saved-cmd-{{ cmd.id }}"
              hx-swap="outerHTML"
              hx-confirm="Are you sure you want to delete this command?">
        Delete
      </button>
    </div>
  {% endfor %}
{% else %}
  <div style="padding: 2rem 1rem; text-align: center; color: var(--text-muted); font-size: 0.875rem;">
    No saved commands
  </div>
{% endif %}
